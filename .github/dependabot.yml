version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps; majors still arrive individually.
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action/* step (init, analyze, ...) must run the
      # same version, or CodeQL fails with "All steps in a workflow that use
      # github/codeql-action must use the same version". Separate PRs for
      # init and analyze broke that, so they are always updated together.
      # No update-types filter: majors must move together too.
      codeql-action:
        patterns:
          - "github/codeql-action*"

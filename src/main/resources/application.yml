spring:
  application:
    name: securevault
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securevault}
    username: ${DB_USERNAME:securevault}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates entities against it
      # at startup - it never generates or alters tables itself.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Single source of truth for the upload limit; DocumentService also
      # enforces it, since not every caller goes through the servlet limit.
      max-file-size: 25MB
      # Room for the multipart boundaries/headers around a 25 MB file.
      max-request-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # No default on purpose: startup fails fast if JWT_SECRET is not set.
    # Must be base64 decoding to >= 32 bytes (openssl rand -base64 48).
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  rate-limit:
    auth:
      # Per client IP, shared between /api/auth/login and /api/auth/register.
      requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  storage:
    # Uploaded files live here as {ownerId}/{documentId}.{ext}. Must not be
    # inside any web-served directory.
    root: ${STORAGE_ROOT:./data/storage}
    # Total bytes of documents a single user may store (e.g. 500MB, 5GB).
    user-quota: ${STORAGE_QUOTA_PER_USER:1GB}

server:
  port: ${SERVER_PORT:8080}

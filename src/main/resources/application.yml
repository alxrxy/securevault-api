spring:
  application:
    name: securevault
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:securevault}
    username: ${DB_USERNAME:securevault}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates entities against it
      # at startup - it never generates or alters tables itself.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-every-environment-to-a-long-random-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${SERVER_PORT:8080}
